name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  TEST_IMAGE: pb/lsp-rust-analyzer:ci

jobs:
  checks:
    name: Validate and smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - name: Validate package sources
        run: npm run package:check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Generate embedded metadata
        id: metadata
        shell: bash
        run: |
          echo "manifest=$(npm run --silent manifest:label)" >> "$GITHUB_OUTPUT"
          echo "schema=$(npm run --silent config-schema:label)" >> "$GITHUB_OUTPUT"
      - name: Build and load test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            PB_LSP_MANIFEST=${{ steps.metadata.outputs.manifest }}
            INTEGRATION_CONFIG_SCHEMA=${{ steps.metadata.outputs.schema }}
      - name: Inspect image metadata
        run: ./scripts/validate-package.py --image "$TEST_IMAGE"
      - name: Run isolated LSP smoke test twice
        run: |
          ./scripts/smoke.py --image "$TEST_IMAGE"
          ./scripts/smoke.py --image "$TEST_IMAGE"
      - name: Assert smoke resources were removed
        shell: bash
        run: |
          test -z "$(docker ps --all --quiet --filter name=pb-ra-smoke-)"
          test -z "$(docker network ls --quiet --filter name=pb-ra-smoke-)"

  release:
    name: Semantic release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release-result.outputs.new_release_published }}
      version: ${{ steps.release-result.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release
      - name: Detect release result
        id: release-result
        shell: bash
        run: |
          release_tag=$(git tag --points-at HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -n "$release_tag" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  docker-publish:
    name: Publish multi-architecture image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate released package sources
        run: npm run package:check
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Generate image metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "manifest=$(npm run --silent manifest:label)" >> "$GITHUB_OUTPUT"
          echo "schema=$(npm run --silent config-schema:label)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_revision=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          version_without_major=${VERSION#*.}
          echo "minor=${VERSION%%.*}.${version_without_major%%.*}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/crunchy-pb/lsp-rust-analyzer:latest
            ghcr.io/crunchy-pb/lsp-rust-analyzer:${{ needs.release.outputs.version }}
            ghcr.io/crunchy-pb/lsp-rust-analyzer:${{ steps.metadata.outputs.major }}
            ghcr.io/crunchy-pb/lsp-rust-analyzer:${{ steps.metadata.outputs.minor }}
            ghcr.io/crunchy-pb/lsp-rust-analyzer:sha-${{ steps.metadata.outputs.short_revision }}
          build-args: |
            PB_LSP_MANIFEST=${{ steps.metadata.outputs.manifest }}
            INTEGRATION_CONFIG_SCHEMA=${{ steps.metadata.outputs.schema }}
            IMAGE_VERSION=${{ needs.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.source=https://github.com/crunchy-pb/lsp-rust-analyzer
